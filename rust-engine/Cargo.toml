[package]
name = "agent-neuron-engine-rs"
version = "0.0.0"
edition = "2021"
publish = false
description = "The agent-neuron engine: conformance on the virtual host, real runs, the desk, peers and the MCP server."
default-run = "neuron-engine"

[lib]
name = "rust_engine"
path = "src/lib.rs"

[[bin]]
name = "neuron-engine"
path = "src/main.rs"

[profile.dev]
opt-level = 1
